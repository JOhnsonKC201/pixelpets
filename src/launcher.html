<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none';" />
  <title>pixelpets quick tools</title>
  <style>
    /* Same palette as Settings, so the launcher reads as the same little app. */
    :root {
      --bg:#191b22; --panel:#23262f; --panel2:#2a2e39; --line:#363b47;
      --fg:#eceef3; --muted:#9aa0ad; --faint:#6b7280;
      --accent:#e8943c; --accent-deep:#b5641d; --good:#8bbf5a;
      --k-calc:#8bbf5a; --k-web:#6aa6e8; --k-note:#d9b44a; --k-todo:#e8943c;
      --k-time:#c98be8; --k-link:#5ec2b0; --k-clip:#9aa0ad; --k-sys:#e8746a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--fg); overflow: hidden; }
    body { font: 13px/1.4 "Segoe UI", -apple-system, system-ui, sans-serif; user-select: none; border: 2px solid #0f1116; }

    .bar { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: linear-gradient(180deg, #1e2027, #181a20); border-bottom: 2px solid #0f1116; }
    .paw { width: 28px; height: 28px; flex: none; display: grid; place-items: center; background: var(--accent); color: #1a1c22; border-radius: 7px; box-shadow: 0 0 0 2px #0f1116, 2px 2px 0 rgba(0,0,0,.45); font-size: 15px; }
    #q { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--fg); font: 500 17px/1.2 inherit; caret-color: var(--accent); }
    #q::placeholder { color: var(--faint); }
    .key { color: var(--faint); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; flex: none; }

    #list { list-style: none; margin: 0; padding: 6px; max-height: 360px; overflow-y: auto; }
    #list:empty { display: none; }
    #list::-webkit-scrollbar { width: 8px; }
    #list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
    .row { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 10px; padding: 7px 9px; border-radius: 7px; cursor: pointer; border: 1px solid transparent; }
    .row .tag { font: 700 9.5px/1 ui-monospace, Consolas, monospace; letter-spacing: .8px; text-align: center; padding: 4px 0; border-radius: 4px; color: #15171d; background: var(--k, var(--muted)); box-shadow: 1px 1px 0 rgba(0,0,0,.45); }
    .row .txt { min-width: 0; }
    .row .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row .s { color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row .n { color: var(--faint); font: 11px ui-monospace, Consolas, monospace; }
    .row.done .t { color: var(--faint); text-decoration: line-through; }
    .row.off { cursor: default; opacity: .75; }
    .row:hover { background: var(--panel); }
    .row[aria-selected="true"] { background: var(--panel2); border-color: var(--accent-deep); box-shadow: inset 3px 0 0 var(--accent); }
    .row[data-kind="calc"], .row[data-kind="convert"] { --k: var(--k-calc); }
    .row[data-kind="calc"] .t, .row[data-kind="convert"] .t { font: 600 16px/1.3 ui-monospace, Consolas, monospace; color: var(--k-calc); }
    .row[data-kind="search"] { --k: var(--k-web); }
    .row[data-kind="note"] { --k: var(--k-note); }
    .row[data-kind="todo"] { --k: var(--k-todo); }
    .row[data-kind="timer"] { --k: var(--k-time); }
    .row[data-kind="shortcut"] { --k: var(--k-link); }
    .row[data-kind="clip"] { --k: var(--k-clip); }
    .row[data-kind="system"] { --k: var(--k-sys); }

    .foot { display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 7px 14px 9px; border-top: 1px solid #0f1116; color: var(--faint); font-size: 11px; }
    .foot b { color: var(--muted); font-weight: 600; font-family: ui-monospace, Consolas, monospace; }
  </style>
</head>
<body>
  <div class="bar">
    <span class="paw" aria-hidden="true">🐾</span>
    <input id="q" type="text" autocomplete="off" spellcheck="false"
           role="combobox" aria-expanded="true" aria-controls="list" aria-autocomplete="list"
           placeholder="Open, note, time, calculate, search…" />
    <span class="key" aria-hidden="true">esc</span>
  </div>
  <ul id="list" role="listbox" aria-label="Quick tools"></ul>
  <div class="foot" id="foot">
    <span><b>=</b> calc</span><span><b>5 km in mi</b></span><span><b>g</b> search</span>
    <span><b>note</b> …</span><span><b>todo</b> …</span><span><b>10m tea</b> timer</span><span><b>done 1</b></span>
  </div>
  <script src="launcher-renderer.js"></script>
</body>
</html>
