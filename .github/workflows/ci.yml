name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (a newer push makes older CI moot).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Piped through tee so the PR bot (pull-request-bot.yml) can read the totals
      # back out of the artifact below. `shell: bash` matters: only the explicit
      # form turns on pipefail, and without it a red `npm test` would hide behind
      # tee's exit code and the job would go green.
      - run: npm test 2>&1 | tee test-output.txt
        shell: bash
      # Uploaded even when the tests fail, because a red run is exactly when the
      # numbers are wanted. The bot treats this file as untrusted text.
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-output
          path: test-output.txt
          retention-days: 7

  boot:
    # bootcheck.js resolves the electron binary through require('electron') and is
    # platform-agnostic, so running it on macOS too is nearly free - and macOS is
    # where the overlay's window behaviour actually differs (Spaces, fullscreen,
    # the accessory-app process type). A Windows-only boot job is how a mac-only
    # regression ships unnoticed.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:boot   # launches the real app (--shot) and asserts it renders

  packaged-boot:
    # The boot job above runs the source tree. Users run what electron-builder
    # packs: an app.asar with its checksum enforced and the release fuses set
    # (package.json build.electronFuses). A fuse or packaging change can leave
    # that build showing a blank page while the source tree is fine, so boot the
    # packed app too, on both platforms.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Pack the app (no installer)
        run: npx electron-builder --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - run: node scripts/bootcheck.js --packaged
